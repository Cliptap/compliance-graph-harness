[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = strict

markers =
    harness: Pruebas del motor del harness de desarrollo (AST, gobernanza, base de datos)
    demo: Pruebas de la aplicación clínica de demostración (citas, pacientes, roles)
    compliance: Pruebas del motor de auditoría y reglas legales (Ley 21.719 / salud)
    ast: Pruebas de extracción AST, construcción de grafos y slicing de contexto
    lineage: Pruebas de trazabilidad de datos y análisis de flujo de contaminación
    governance: Pruebas de integridad del pipeline de 12 skills y reglas Always-On
    db: Pruebas de persistencia y trazabilidad en SQLite
    fast: Pruebas ultra-rápidas en memoria (< 1 segundo)
