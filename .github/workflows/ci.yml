name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -e .

      - name: Shell syntax
        shell: bash
        run: bash -n install.sh

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Doctor
        run: python -m src.harness.doctor

      - name: Test suite
        run: python -m pytest tests -q

      - name: Curated gate corpus
        run: python harness/eval/catalog_corpus.py

      - name: Held-out regression corpus
        run: python harness/eval/catalog_corpus.py --corpus harness/eval/catalog_corpus_heldout.json --out qa_reports/catalog-corpus/heldout_metrics.json
